<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ex</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0b0b0b; color: #f5f5f5;
      font-family: 'Courier New', Courier, monospace;
    }

    #stage {
      position: relative; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      perspective: 1400px;
    }

    #text {
      position: absolute; width: 0; height: 0;
      transform-style: preserve-3d;
    }

    .char {
      position: absolute;
      white-space: pre;
      display: inline-block;
      will-change: transform, opacity;
      word-break: keep-all; 
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="text"></div>
  </div>

<script>
"use strict";

const RETURN_FORCE = 0.05;
const DAMPING = 0.88;
const REPULSE_RADIUS = 150;
const REPULSE_FORCE = 0.7;
const CYLINDER_RADIUS = 350; // 이름이 많아져서 반지름을 살짝 키웠습니다.

let rotY = 0;
let rotSpeed = -0.0015; // 더 우아하게 회전하도록 속도 조절
let camTilt = 0;

/* 각 줄에 약 20명씩, 기존보다 2배 늘린 리스트 */
const LYRICS = [
  "Kim Minjun     Lee Seojun     Park Jihoo     Choi Dohyun     Jung Yejun     Kang Siwoo     Yoon Jinho     Jang Hyunwoo     Lim Junsu     Han Sangwook     Kwon Daniel     Shin Minsoo     Ahn Jaehyun     Hwang Sunwoo     Song Minho     Jeon Jungkook     Hong Gildong     Yoo Taeyang     Baek Seungwon     Cho Yujin",
  "Moon Yerim     Yang Jiwon     Son Heungmin     Suh Dahye     Heo Youngjae     Ko Minji     No Seungho     Na Kyungsoo     Koo Bonhyuk     Gwak Jinsung     Cha Eunwoo     Ryu Hyunjin     Sim Sangmin     Min Yoongi     Um Taewoong     Won Bin     Chun Woosung     Pyo Jiwon     Geum Nara     Ji Changwook",
  "Kim Hana     Lee Sanghyuk     Park Boyoung     Choi Wooshik     Jung Haein     Kang Haemin     Yoon Sarang     Jang Donggun     Lim Nayoung     Han Jimin     Kwon Sora     Shin Dongwook     Ahn Yujin     Hwang Inyeop     Song Kang     Jeon Somi     Hong Soojin     Yoo Jaeasuk     Baek Hyun     Cho Seungho",
  "Moon Dongmin     Yang Heejin     Son Yerim     Suh Joonki     Heo Solji     Ko Ara     No Minwoo     Na Yeong     Koo Hara     Gwak Doowon     Cha Seungwon     Ryu Junyeol     Sim Eunkyung     Min Kyunghoon     Um Jiwon     Won Jung     Chun Boram     Pyo Minho     Geum Jandi     Ji Sooyun",
  "Kim Taehyung     Lee Younghee     Park Chanyeol     Choi Minho     Jung Kook     Kang Daniel     Yoon Bomi     Jang Nara     Lim Siwan     Han Gain     Kwon Yuri     Shin Ryujin     Ahn Joongki     Hwang Jungum     Song Hyekyo     Jeon Jihyun     Hong Seokcheon     Yoo Yeonseok     Baek Jiyoung     Cho Kyuhyun",
  "Moon Geunyoung     Yang Sechan     Son Naeun     Suh Kangjoon     Heo Joon     Ko Jiyoung     No Hongchul     Na Hoon     Koo Junhoe     Gwak Minjung     Cha Taehyun     Ryu Sooyoung     Sim Hyungtak     Min Hyoorin     Um Jungwa     Won Soojin     Chun Myung     Pyo Yejin     Geum Taek     Ji Sung",
  "Kim Jisoo     Lee Dahee     Park Seojoon     Choi Siwon     Jung Woosung     Kang Dongwon     Yoon Kyunsang     Jang Hyuk     Lim Yuri     Han Hyojoo     Kwon Sangwoo     Shin Seunghun     Ahn Sungki     Hwang Minhyun     Song Joongki     Jeon Dooyun     Hong Bin     Yoo Jitae     Baek Jongwon     Cho Minho",
  "Moon Heejun     Yang Yoseob     Son Dongwoon     Suh Jisub     Heo Gayoon     Ko Sooyoung     No Eul     Na Eun     Koo Kyunghwa     Gwak Jihyuk     Cha Yeun     Ryu Seungryong     Sim Sooyoung     Min Jihyun     Um Kiyong     Won Miyeon     Chun Inkwon     Pyo Changwon     Geum Ryung     Ji Min",
  "Kim Minjun     Lee Seojun     Park Jihoo     Choi Dohyun     Jung Yejun     Kang Siwoo     Yoon Jinho     Jang Hyunwoo     Lim Junsu     Han Sangwook     Kwon Daniel     Shin Minsoo     Ahn Jaehyun     Hwang Sunwoo     Song Minho     Jeon Jungkook     Hong Gildong     Yoo Taeyang     Baek Seungwon     Cho Yujin",
  "Moon Yerim     Yang Jiwon     Son Heungmin     Suh Dahye     Heo Youngjae     Ko Minji     No Seungho     Na Kyungsoo     Koo Bonhyuk     Gwak Jinsung     Cha Eunwoo     Ryu Hyunjin     Sim Sangmin     Min Yoongi     Um Taewoong     Won Bin     Chun Woosung     Pyo Jiwon     Geum Nara     Ji Changwook",
  "Kim Hana     Lee Sanghyuk     Park Boyoung     Choi Wooshik     Jung Haein     Kang Haemin     Yoon Sarang     Jang Donggun     Lim Nayoung     Han Jimin     Kwon Sora     Shin Dongwook     Ahn Yujin     Hwang Inyeop     Song Kang     Jeon Somi     Hong Soojin     Yoo Jaeasuk     Baek Hyun     Cho Seungho",
  "Moon Dongmin     Yang Heejin     Son Yerim     Suh Joonki     Heo Solji     Ko Ara     No Minwoo     Na Yeong     Koo Hara     Gwak Doowon     Cha Seungwon     Ryu Junyeol     Sim Eunkyung     Min Kyunghoon     Um Jiwon     Won Jung     Chun Boram     Pyo Minho     Geum Jandi     Ji Sooyun",
  "Kim Taehyung     Lee Younghee     Park Chanyeol     Choi Minho     Jung Kook     Kang Daniel     Yoon Bomi     Jang Nara     Lim Siwan     Han Gain     Kwon Yuri     Shin Ryujin     Ahn Joongki     Hwang Jungum     Song Hyekyo     Jeon Jihyun     Hong Seokcheon     Yoo Yeonseok     Baek Jiyoung     Cho Kyuhyun",
  "Moon Geunyoung     Yang Sechan     Son Naeun     Suh Kangjoon     Heo Joon     Ko Jiyoung     No Hongchul     Na Hoon     Koo Junhoe     Gwak Minjung     Cha Taehyun     Ryu Sooyoung     Sim Hyungtak     Min Hyoorin     Um Jungwa     Won Soojin     Chun Myung     Pyo Yejin     Geum Taek     Ji Sung",
  "Kim Jisoo     Lee Dahee     Park Seojoon     Choi Siwon     Jung Woosung     Kang Dongwon     Yoon Kyunsang     Jang Hyuk     Lim Yuri     Han Hyojoo     Kwon Sangwoo     Shin Seunghun     Ahn Sungki     Hwang Minhyun     Song Joongki     Jeon Dooyun     Hong Bin     Yoo Jitae     Baek Jongwon     Cho Minho",
  "Moon Heejun     Yang Yoseob     Son Dongwoon     Suh Jisub     Heo Gayoon     Ko Sooyoung     No Eul     Na Eun     Koo Kyunghwa     Gwak Jihyuk     Cha Yeun     Ryu Seungryong     Sim Sooyoung     Min Jihyun     Um Kiyong     Won Miyeon     Chun Inkwon     Pyo Changwon     Geum Ryung     Ji Min"
];

const textEl = document.getElementById("text");
const chars = [];
const mouse = { x: 9999, y: 9999 };

function buildText() {
  textEl.innerHTML = "";
  chars.length = 0;
  const lineHeight = 30;
  let charIndex = 0;

  LYRICS.forEach((line, row) => {
    let tempSpans = [];
    let lineWidth = 0;

    for (let i = 0; i < line.length; i++) {
      const span = document.createElement("span");
      span.className = "char";
      span.textContent = line[i];
      textEl.appendChild(span);

      const w = span.getBoundingClientRect().width || 10;
      tempSpans.push({ el: span, w });
      lineWidth += w;
    }

    let cursorX = -lineWidth / 2;

    tempSpans.forEach(obj => {
      chars.push({
        el: obj.el,
        index: charIndex++,
        baseX: cursorX,
        baseY: row * lineHeight,
        x: cursorX,
        y: 0,
        vx: 0,
        vy: 0
      });
      cursorX += obj.w;
    });
  });
}

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX - window.innerWidth / 2;
  mouse.y = e.clientY - window.innerHeight / 2;
});

function update() {
  rotY += rotSpeed;
  const totalHeight = LYRICS.length * 30;

  chars.forEach(c => {
    const wrappedY = ((c.baseY + rotY * 1000) % totalHeight + totalHeight) % totalHeight;
    const theta = (wrappedY / totalHeight) * Math.PI * 2;

    const z = Math.cos(theta) * CYLINDER_RADIUS;
    const y = Math.sin(theta) * CYLINDER_RADIUS;

    const dx = c.x - mouse.x;
    const dy = c.y - mouse.y;
    const dist = Math.hypot(dx, dy);

    if (dist < REPULSE_RADIUS) {
      const f = (1 - dist / REPULSE_RADIUS) * REPULSE_FORCE;
      c.vx += (dx / dist) * f;
      c.vy += (dy / dist) * f;
    }

    c.vx += (c.baseX - c.x) * RETURN_FORCE;
    c.vy += (y - c.y) * RETURN_FORCE;

    c.vx *= DAMPING;
    c.vy *= DAMPING;

    c.x += c.vx;
    c.y += c.vy;

    const depthNorm = (z + CYLINDER_RADIUS) / (2 * CYLINDER_RADIUS);
    const scale = 0.5 + depthNorm * 0.5;
    const opacity = 0.1 + depthNorm * 0.9;

    c.el.style.transform = `translate3d(${c.x}px, ${c.y}px, ${z}px) rotateY(${camTilt}rad) scale(${scale})`;
    c.el.style.opacity = opacity;
  });

  requestAnimationFrame(update);
}

buildText();
requestAnimationFrame(update);
</script>
</body>
</html>
