<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOREA - Centered</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    #text {
      position: absolute; /* 중앙 고정을 위해 absolute 변경 */
      width: 0; /* 기준점만 사용 */
      height: 0;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char {
      position: absolute;
      white-space: pre;
      will-change: transform, opacity;
      display: inline-block;
      transform-origin: center;
    }
  </style>
</head>
<body>
<div id="stage">
  <div id="text"></div>
</div>

<script>
"use strict";

/* CONFIG */
var RETURN_FORCE = 0.05;
var DAMPING = 0.88;
var REPULSE_RADIUS = 150;
var REPULSE_FORCE = 0.7;
var CYLINDER_RADIUS = 300; // 반지름 약간 조정

var rotY = 0;
var rotSpeed = -0.002;
var camTilt = 0;

/* TEXT */
var LYRICS = [
  "Kim Minjun     Lee Seojun     Park Jihoo     Choi Dohyun     Jung Yejun     Kang Siwoo     Yoon Jinho     Jang Hyunwoo     Lim Junsu     Han Sangwook",
  "Kwon Daniel     Shin Minsoo     Ahn Jaehyun     Hwang Sunwoo     Song Minho     Jeon Jungkook     Hong Gildong     Yoo Taeyang     Baek Seungwon     Cho Yujin",
  "Moon Yerim     Yang Jiwon     Son Heungmin     Suh Dahye     Heo Youngjae     Ko Minji     No Seungho     Na Kyungsoo     Koo Bonhyuk     Gwak Jinsung",
  "Cha Eunwoo     Ryu Hyunjin     Sim Sangmin     Min Yoongi     Um Taewoong     Won Bin     Chun Woosung     Pyo Jiwon     Geum Nara     Ji Changwook",
  "Kim Hana     Lee Sanghyuk     Park Boyoung     Choi Wooshik     Jung Haein     Kang Haemin     Yoon Sarang     Jang Donggun     Lim Nayoung     Han Jimin",
  "Kwon Sora     Shin Dongwook     Ahn Yujin     Hwang Inyeop     Song Kang     Jeon Somi     Hong Soojin     Yoo Jaeasuk     Baek Hyun     Cho Seungho",
  "Moon Dongmin     Yang Heejin     Son Yerim     Suh Joonki     Heo Solji     Ko Ara     No Minwoo     Na Yeong     Koo Hara     Gwak Doowon",
  "Cha Seungwon     Ryu Junyeol     Sim Eunkyung     Min Kyunghoon     Um Jiwon     Won Jung     Chun Boram     Pyo Minho     Geum Jandi     Ji Sooyun",
  "Kim Taehyung     Lee Younghee     Park Chanyeol     Choi Minho     Jung Kook     Kang Daniel     Yoon Bomi     Jang Nara     Lim Siwan     Han Gain",
  "Kwon Yuri     Shin Ryujin     Ahn Joongki     Hwang Jungum     Song Hyekyo     Jeon Jihyun     Hong Seokcheon     Yoo Yeonseok     Baek Jiyoung     Cho Kyuhyun",
  "Moon Geunyoung     Yang Sechan     Son Naeun     Suh Kangjoon     Heo Joon     Ko Jiyoung     No Hongchul     Na Hoon     Koo Junhoe     Gwak Minjung",
  "Cha Taehyun     Ryu Sooyoung     Sim Hyungtak     Min Hyoorin     Um Jungwa     Won Soojin     Chun Myung     Pyo Yejin     Geum Taek     Ji Sung",
  "Kim Jisoo     Lee Dahee     Park Seojoon     Choi Siwon     Jung Woosung     Kang Dongwon     Yoon Kyunsang     Jang Hyuk     Lim Yuri     Han Hyojoo",
  "Kwon Sangwoo     Shin Seunghun     Ahn Sungki     Hwang Minhyun     Song Joongki     Jeon Dooyun     Hong Bin     Yoo Jitae     Baek Jongwon     Cho Minho",
  "Moon Heejun     Yang Yoseob     Son Dongwoon     Suh Jisub     Heo Gayoon     Ko Sooyoung     No Eul     Na Eun     Koo Kyunghwa     Gwak Jihyuk",
  "Cha Yeun     Ryu Seungryong     Sim Sooyoung     Min Jihyun     Um Kiyong     Won Miyeon     Chun Inkwon     Pyo Changwon     Geum Ryung     Ji Min",
];

var textEl = document.getElementById("text");
var chars = [];
var mouse = { x: -9999, y: -9999 };

function buildText() {
  textEl.innerHTML = "";
  chars.length = 0;
  var charIndex = 0;

  LYRICS.forEach(function (line, row) {
    var rowContainer = document.createElement("div"); // 가상 너비 계산용
    var tempChars = [];
    var lineWidth = 0;

    for (var i = 0; i < line.length; i++) {
      var span = document.createElement("span");
      span.className = "char";
      span.textContent = line[i];
      textEl.appendChild(span);
      
      // 임시 폰트 너비 계산 (기본 10px, 띄어쓰기 대응)
      var charW = line[i] === " " ? 8 : 11; 
      lineWidth += charW;

      tempChars.push({ el: span, w: charW });
    }

    var cursorX = -lineWidth / 2; // 각 줄의 시작점을 중앙으로 보정

    tempChars.forEach(function (obj) {
      chars.push({
        el: obj.el,
        index: charIndex++,
        baseX: cursorX,
        baseY: row * 26, 
        x: cursorX, y: 0, vx: 0, vy: 0
      });
      cursorX += obj.w;
    });
  });
}

window.addEventListener("mousemove", function (e) {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function update() {
  rotY += rotSpeed;
  var totalHeight = LYRICS.length * 26;

  chars.forEach(function (c) {
    var wrappedY = ((c.baseY + rotY * 600) % totalHeight + totalHeight) % totalHeight;
    var theta = (wrappedY / totalHeight) * Math.PI * 2;

    var z = Math.cos(theta) * CYLINDER_RADIUS;
    var y = Math.sin(theta) * CYLINDER_RADIUS;

    var targetX = c.baseX;
    var targetY = y;

    var rect = c.el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = cx - mouse.x;
    var dy = cy - mouse.y;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0 && dist < REPULSE_RADIUS) {
      var f = (1 - dist / REPULSE_RADIUS) * REPULSE_FORCE;
      c.vx += (dx / dist) * f;
      c.vy += (dy / dist) * f;
    }

    c.vx += (targetX - c.x) * RETURN_FORCE;
    c.vy += (targetY - c.y) * RETURN_FORCE;
    c.vx *= DAMPING;
    c.vy *= DAMPING;
    c.x += c.vx;
    c.y += c.vy;

    var depthNorm = (z + CYLINDER_RADIUS) / (2 * CYLINDER_RADIUS);
    var scale = 0.5 + depthNorm * 0.5;
    var opacity = 0.1 + depthNorm * 0.9;

    // 중앙 정렬을 위해 translate3d 적용
    c.el.style.transform = 
      "translate3d(" + c.x + "px, " + c.y + "px, " + z + "px) rotateY(" + camTilt + "rad) scale(" + scale + ")";
    c.el.style.opacity = opacity;
    c.el.style.zIndex = Math.floor(z);
  });

  requestAnimationFrame(update);
}

buildText();
requestAnimationFrame(update);
</script>
</body>
</html>
